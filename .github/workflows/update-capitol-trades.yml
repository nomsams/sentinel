name: Update Capitol Trades snapshot

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sentinel-data-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out dashboard
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch every Capitol Trades page
        env:
          CAPITOL_BROWSER_PATH: /usr/bin/google-chrome
        run: node scripts/fetch-capitol-trades.mjs

      - name: Commit refreshed snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/capitol-trades.json
          if git diff --cached --quiet; then
            echo "Capitol Trades snapshot is unchanged."
          else
            git commit -m "Update Capitol Trades snapshot"
            git push
          fi
